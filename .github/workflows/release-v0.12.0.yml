name: Publish EMCP v0.12.0

# v0.12.0 — performance release: lazy slot1 JSON decode in EmcpFrame.unpack
# (the dominant cost of a big-frame unpack, ~90%, is now deferred to the
# first args access) and the adaptive sync-handler inline fast path in
# EmcpServer.handle_frame (a fast sync handler no longer pays the full
# asyncio.to_thread() offload cost). The tag is created server-side by the
# publish job, pinned to the commit that ran the gate. An existing tag is
# never moved silently.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.12.0.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["version"] == "0.12.0", "Package version does not match release"
          PY
      - name: Python tests
        run: |
          python -m pip install -e .
          python -m unittest discover tests -v
      - name: Rust tests
        run: cargo test -p emcp-core
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: emcp-v0.12.0-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: emcp-v0.12.0-dist
          path: dist
      - name: Refuse to publish over an existing tag
        env:
          TAG: v0.12.0
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.12.0
          name: v0.12.0
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          body: |
            Performance release. Lazy slot1 (args) JSON decode:
            EmcpFrame.unpack no longer runs orjson.loads on slot1 eagerly
            (~90% of a 64KB-frame unpack). The raw slot1 bytes are stashed
            under _args_raw and decoded on first args access via a new
            __getattr__, at most once. pack_slots reuses _args_raw on the
            wire->repack (relay) path, byte-identical to the wire. The
            adaptive sync-handler inline fast path runs a fast sync handler
            in-process instead of paying the full asyncio.to_thread()
            offload cost, falling back to to_thread for slow handlers.

            frame.unpack (big 64KB): 415.85us -> 14.16us (-97%, 28x)
            relay unpack->pack (big 64KB): ~414us -> 19.56us (-95%)
            server round-trip (small): 140.44us -> 73.42us (-48%)

            Wire format byte-identical on unpack->pack. 70/70 tests pass.
