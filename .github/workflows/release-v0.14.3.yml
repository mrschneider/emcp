name: Publish EMCP v0.14.3

# v0.14.3 — performance release: flat-list token-budget escrows (the hot path
# escrow->spend->commit runs once per tool call, so storing each reservation as
# a small flat list instead of an EscrowEntry object avoids a per-call object
# allocation and three attribute lookups per cycle).
# The tag is created server-side by the publish job, pinned to the commit that
# ran the gate. An existing tag is never moved silently.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.14.3.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["version"] == "0.14.3", "Package version does not match release"
          PY
      - name: Python tests
        run: |
          python -m pip install -e .
          python -m unittest discover tests -v
      - name: Rust tests
        run: cargo test -p emcp-core
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: emcp-v0.14.3-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: emcp-v0.14.3-dist
          path: dist
      - name: Refuse to publish over an existing tag
        env:
          TAG: v0.14.3
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14.3
          name: v0.14.3
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          body: |
            Performance release. Flat-list token-budget escrows: the
            TokenBudgetLedger stored each tool-call reservation as an
            EscrowEntry object, and the hot path (escrow -> spend -> commit)
            runs once per tool invocation, so the per-object allocation and
            three attribute lookups per cycle added overhead to every call.
            The ledger now stores each entry as a small flat list
            [reserved, spent, committed] — a list allocation is cheaper than an
            object allocation and the hot path reads three positional indices
            instead of three attribute lookups. EscrowEntry is kept as a
            public, importable class (exported from emcp and referenced by the
            test-suite) with the same public fields, so existing callers and
            imports keep working. Wire format byte-identical on pack/unpack.
            70/70 tests pass.
