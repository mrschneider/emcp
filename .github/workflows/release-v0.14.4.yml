name: Publish EMCP v0.14.4

# v0.14.4 — security release: server-side replay / duplicate-transaction guard.
# A frame whose transaction_id had already been processed could be re-sent and
# re-executed: the escrow ledger refused a duplicate tx_id, but only AFTER the
# tool handler had run, so a captured or re-sent frame could re-execute a
# mutating tool, double-apply a side effect, or double-count tokens. The guard
# now short-circuits BEFORE the handler runs. The tag is created server-side by
# the publish job, pinned to the commit that ran the gate. An existing tag is
# never moved silently.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.14.4.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["version"] == "0.14.4", "Package version does not match release"
          PY
      - name: Python tests
        run: |
          python -m pip install -e .
          python -m unittest discover tests -v
      - name: Rust tests
        run: cargo test -p emcp-core
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: emcp-v0.14.4-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: emcp-v0.14.4-dist
          path: dist
      - name: Refuse to publish over an existing tag
        env:
          TAG: v0.14.4
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14.4
          name: v0.14.4
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          body: |
            Security release. Server-side replay / duplicate-transaction guard.

            A frame whose transaction_id had already been processed could be
            re-sent and re-executed: the escrow ledger refused a duplicate
            tx_id, but only AFTER the tool handler had run, so a captured or
            re-sent frame could re-execute a mutating tool, double-apply a
            side effect, or double-count tokens.

            The guard now short-circuits BEFORE the handler runs:
            - server.py: bounded ring-evicted dedup (_seen_tx_ids/_seen_tx_order),
              O(1) mark + membership check, replay_cache_size default 10000;
              placed after PlatSec, before escrow.
            - constants.py / constants.rs: add EMCP_ERR_REPLAY_DETECTED = 12
              (wire enum kept in sync between Python and Rust).
            - tests/test_replay_guard.py: handler runs once then rejected on
              replay; distinct tx_ids processed; window is bounded;
              list_tools unaffected.

            74/74 tests pass.
