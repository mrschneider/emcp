name: Publish EMCP v0.14.2

# v0.14.2 — performance release: one-shot sync-handler probe (a slow sync
# handler no longer runs twice — the old adaptive scheme re-ran it in a worker
# thread after the inline attempt, doubling its first-call latency) and
# slots=True on ToolCandidateRegistration (heartbeat() is the hottest path in
# a mesh; slots skip the per-instance __dict__ indirection on every pulse).
# The tag is created server-side by the publish job, pinned to the commit that
# ran the gate. An existing tag is never moved silently.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.14.2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["version"] == "0.14.2", "Package version does not match release"
          PY
      - name: Python tests
        run: |
          python -m pip install -e .
          python -m unittest discover tests -v
      - name: Rust tests
        run: cargo test -p emcp-core
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: emcp-v0.14.2-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: emcp-v0.14.2-dist
          path: dist
      - name: Refuse to publish over an existing tag
        env:
          TAG: v0.14.2
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14.2
          name: v0.14.2
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          body: |
            Performance release. One-shot sync-handler probe: the old adaptive
            scheme ran a sync handler inline, measured it, and — when it
            exceeded the asyncio.to_thread offload cost — re-ran the SAME
            handler a second time in a worker thread before returning, so a
            slow handler's first call paid ~2x its own latency. A one-shot
            probe now classifies the handler on its first call (fast -> inline,
            slow -> offloaded) and never re-runs it; handlers that later
            degrade are re-classified. Concurrency is preserved (two slow calls
            still overlap).

            slots=True on ToolCandidateRegistration: heartbeat() writes
            reg.last_heartbeat on every pulse (the hottest path in a mesh); a
            slots dataclass stores attributes in a fixed C-level table,
            skipping the per-instance __dict__ indirection.

            slow handler first call (150ms): 305ms (2 execs) -> 154ms (1 exec) (-49%, 2.0x)
            small round-trip (reused client): 11.4us -> 9.5us (-17%, 1.2x)
            qos.heartbeat (pin -> 5000 tools): ~90us -> ~86us (~-5%)

            Wire format byte-identical on pack/unpack. 70/70 tests pass.
