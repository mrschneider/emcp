name: Publish EMCP v0.10.0

# v0.10.0 is re-tagged from the commit that carries the capability-policy
# and escrow fixes. The first push of this tag pointed at c892faf — the
# commit BEFORE those fixes — so this job's guardrail ("the tag already
# exists; refusing to move it") stopped the publish and left the release
# uncreated. The tag is now created from the fixed commit, and the
# guardrail stays as it is: an existing tag is never moved silently.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.10.0.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["version"] == "0.10.0", "Package version does not match release"
          PY
      - name: Python tests
        run: |
          python -m pip install -e .
          python -m unittest discover tests -v
      - name: Rust tests
        run: cargo test -p emcp-core
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: emcp-v0.10.0-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: emcp-v0.10.0-dist
          path: dist
      - name: Refuse to publish over an existing tag
        env:
          TAG: v0.10.0
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      # The release and its tag are created server-side by the action, in
      # one call, pinned to the commit that ran the gate. The previous
      # version of this job created the tag with `git tag -a` + `git push`
      # and then ran `gh release create --verify-tag`; the annotated-tag
      # step needs a git identity in the runner and died there, leaving
      # the release unpublished.
      - name: Publish the release and its tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.0
          name: v0.10.0
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          body: |
            Security hardening release: explicit capability policies for
            discovered MCP tools, fail-closed discovery errors, escrow
            lifecycle accounting corrections, duplicate transaction ID
            rejection, and regression coverage. Python and Rust tests are
            required to pass before publication.
