name: Publish EMCP v0.10.0

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v0.10.0.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify package version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert data["project"]["version"] == "0.10.0", "Package version does not match release"
          PY
      - name: Python tests
        run: |
          python -m pip install -e .
          python -m unittest discover tests -v
      - name: Rust tests
        run: cargo test -p emcp-core
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: emcp-v0.10.0-dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: emcp-v0.10.0-dist
          path: dist
      - name: Publish immutable release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.10.0
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
          git tag -a "$TAG" "$GITHUB_SHA" -m "EMCP $TAG — capability policy and escrow hardening"
          git push origin "refs/tags/$TAG"
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$TAG" dist/* --verify-tag --title "EMCP $TAG" --notes "Security hardening release: explicit capability policies for discovered MCP tools, fail-closed discovery errors, escrow lifecycle accounting corrections, duplicate transaction ID rejection, and regression coverage. Python and Rust tests are required to pass before publication."
