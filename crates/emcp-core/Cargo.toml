[package]
name = "emcp-core"
version = "0.1.0"
edition = "2021"
authors = ["Architecture Team / Infrastructure Operations"]
description = "EMCP core zero-copy wire frame, PlatSec bitmask enforcement, and token budget accounting"

[dependencies]
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
